<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EWC Corp. — Sign In</title>
<link rel="icon" type="image/svg+xml" href="easyway_icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --navy-950:#0a0f1e; --navy-900:#0f1830; --navy-800:#16213f; --navy-700:#22315a;
    --amber-500:#e8a13a; --amber-400:#f2b854; --paper:#f3efe6; --coral-500:#d9614f; --line:#2a3a63;
    --font-display:'Rockwell',Georgia,serif; --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--navy-950); color:var(--paper); font-family:var(--font-body); }
  body{ display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:380px; background:var(--navy-900); border:1px solid var(--line); border-radius:18px; padding:32px; }
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber-400); margin:0 0 6px; text-align:center; }
  h1{ font-family:var(--font-display); font-size:26px; margin:0 0 26px; text-align:center; }
  label{ display:block; font-size:12px; color:#9fb0d6; margin-bottom:6px; font-family:var(--font-mono); }
  input{
    width:100%; background:var(--navy-800); border:1px solid var(--line); color:var(--paper);
    border-radius:8px; padding:12px 14px; font-size:15px; margin-bottom:18px; font-family:var(--font-body);
  }
  input:focus{ outline:2px solid var(--amber-500); }
  button{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--amber-500);
    color:var(--navy-950); font-family:var(--font-display); font-weight:700; font-size:16px; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ background:rgba(217,97,79,0.12); border:1px solid var(--coral-500); color:#f3c9c2; border-radius:8px;
    padding:10px 12px; font-size:13px; margin-bottom:16px; display:none; }
  .error.show{ display:block; }
  footer{ text-align:center; margin-top:20px; font-family:var(--font-mono); font-size:11px; color:#4a5a85; }
</style>
</head>
<body>

  <div class="card">
  <p class="eyebrow">Easy Ways Connection Corp.</p>
  <h1>Sign In</h1>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" id="submitBtn">Sign In</button>
  </form>

  <footer>Easy Ways Connection Corp. · Internal use only</footer>
</div>

<script src="supabase-config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  // If already logged in (e.g. came back to this page by mistake), skip straight ahead.
  (async () => {
    const emp = await getMyEmployeeRecord();
    if (emp) routeToRoleHome(emp);
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      showError('Incorrect email or password. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    const emp = await getMyEmployeeRecord();
    if (!emp) {
      showError('Your login worked, but no employee record is linked to it yet. Please contact an administrator.');
      await supabaseClient.auth.signOut();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
      return;
    }

    routeToRoleHome(emp);
  });
</script>

</body>
</html>
